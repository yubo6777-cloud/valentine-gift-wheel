<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>给老婆的情人节礼物转盘</title>
  <style>
    :root {
      --ink: #4b1b27;
      --muted: #8f6370;
      --rose: #ef5f79;
      --hot: #dc3156;
      --gold: #f3bd53;
      --cream: #fffaf5;
      --line: rgba(100, 34, 50, .12);
      --shadow: 0 24px 70px rgba(92, 22, 46, .18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #fff8f2;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .page {
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 217, 210, .7), transparent 26%),
        radial-gradient(circle at 86% 78%, rgba(253, 224, 186, .55), transparent 24%),
        linear-gradient(135deg, #fff8f4 0%, #fffdf9 48%, #fff6f0 100%);
    }
    .page::before, .page::after {
      content: "♥";
      position: fixed;
      color: rgba(232, 80, 111, .10);
      font-size: 24rem;
      line-height: 1;
      z-index: -1;
      pointer-events: none;
    }
    .page::before { left: -8rem; top: 20%; transform: rotate(-17deg); }
    .page::after { right: -7rem; bottom: -5rem; transform: rotate(16deg); }
    .shell { width: min(1100px, calc(100% - 36px)); margin: 0 auto; padding: 30px 0 44px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: var(--hot); color: #fff; box-shadow: 0 8px 22px rgba(220,49,86,.25); font-size: 22px; }
    .brand-text { font-weight: 800; letter-spacing: .04em; font-size: 15px; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .badge { padding: 9px 13px; border: 1px solid rgba(219, 70, 95, .17); background: rgba(255,255,255,.65); border-radius: 99px; color: var(--hot); font-weight: 700; font-size: 12px; white-space: nowrap; }
    .hero { margin: 26px 0 28px; }
    h1 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(36px, 5.8vw, 66px); line-height: 1.03; letter-spacing: -.04em; color: #601c2e; }
    .hero p { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
    .game-card { position: relative; background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.9); box-shadow: var(--shadow); border-radius: 28px; padding: clamp(18px, 4vw, 40px); overflow: hidden; }
    .game-card::after { content:""; position:absolute; width: 180px; height:180px; right:-80px; top:-90px; border-radius:50%; background: rgba(255,203,160,.20); pointer-events:none; }
    .wheel-wrap { width: min(100%, 570px); aspect-ratio: 1; margin: 0 auto; position: relative; display: grid; place-items: center; }
    .wheel { width: 100%; height: 100%; position: relative; border-radius: 50%; background: conic-gradient(from -10deg, #ff8ea0 0deg 40deg, #ffd27d 40deg 80deg, #f77e91 80deg 120deg, #ffe1a7 120deg 160deg, #ff9aad 160deg 200deg, #ffd27d 200deg 240deg, #f77e91 240deg 280deg, #ffe1a7 280deg 320deg, #ff9aad 320deg 360deg); border: 13px solid #fff; box-shadow: 0 16px 34px rgba(130, 39, 59, .19), inset 0 0 0 3px rgba(255,255,255,.66); transition: transform 5.8s cubic-bezier(.12,.72,.13,1); transform: rotate(0deg); }
    .wheel::before { content:""; position:absolute; inset: 9px; border-radius:50%; border: 1px dashed rgba(113, 38, 57, .28); }
    .labels { position: absolute; inset: 0; }
    .label { position: absolute; left: 50%; top: 50%; width: 30%; margin-left: -15%; margin-top: -7%; transform-origin: 50% 50%; text-align: center; color: #6b2535; font-size: clamp(16px, 2.2vw, 21px); line-height: 1.12; font-weight: 900; text-shadow: 0 1px rgba(255,255,255,.75); }
    .label span { display:block; }
    .label.flip span { transform: rotate(180deg); }
    .hub { position:absolute; width: 88px; height: 88px; border-radius:50%; background: #fff; border: 9px solid #efb1aa; box-shadow: 0 5px 14px rgba(121,37,59,.18); display:grid; place-items:center; z-index: 2; color: var(--hot); font-size: 27px; }
    .pointer { position:absolute; z-index: 4; top: -8px; left:50%; transform: translateX(-50%); width: 0; height:0; border-left: 19px solid transparent; border-right: 19px solid transparent; border-top: 44px solid var(--hot); filter: drop-shadow(0 5px 3px rgba(112,31,52,.25)); }
    .pointer::after { content:""; position:absolute; left:-7px; top:-38px; width:14px; height:14px; border-radius:50%; background:#ffd66e; }
    .cta-row { display:flex; justify-content:center; margin-top: 24px; }
    .spin-btn { border:0; border-radius: 14px; background: linear-gradient(135deg, #e74464, #c92852); color:#fff; font-size: 17px; font-weight: 800; letter-spacing: .08em; padding: 15px 34px; min-width: 190px; cursor:pointer; box-shadow: 0 10px 20px rgba(202,40,82,.25); transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease; }
    .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 25px rgba(202,40,82,.32); }
    .spin-btn:active { transform: translateY(1px); }
    .spin-btn:disabled { opacity: .55; cursor: wait; transform: none; }
    .side { display:grid; gap: 14px; }
    .panel { background: rgba(255,255,255,.75); border: 1px solid var(--line); border-radius: 20px; padding: 19px; box-shadow: 0 12px 30px rgba(92,22,46,.07); }
    .panel h2 { margin:0 0 14px; font-size: 14px; letter-spacing:.06em; }
    .prize-list { display:grid; gap: 8px; }
    .prize { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; color:#713444; }
    .prize i { width: 9px; height: 9px; border-radius:50%; flex:none; background: var(--dot, #f37c91); box-shadow: 0 0 0 3px rgba(255,255,255,.7); }
    .history { display:grid; gap: 0; }
    .history-empty { color: #aa8490; font-size: 13px; line-height: 1.5; }
    .history-item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding: 10px 0; border-top:1px solid rgba(100,34,50,.09); font-size: 13px; }
    .history-item:first-child { border-top:0; padding-top:0; }
    .history-time { font-size:11px; color:#ac8991; white-space:nowrap; }
    .note { margin-top: 12px; font-size:12px; color:#aa8490; line-height:1.5; }
    footer { text-align:center; color:#b69098; font-size:12px; margin-top:22px; }
    .modal-backdrop { position: fixed; inset:0; display:grid; place-items:center; background: rgba(59,13,29,.34); z-index:10; opacity:0; pointer-events:none; transition: opacity .22s ease; padding:20px; }
    .modal-backdrop.open { opacity:1; pointer-events:auto; }
    .modal { width:min(420px, 100%); border-radius: 24px; background: #fffaf6; padding: 31px 26px 25px; text-align:center; box-shadow: 0 25px 90px rgba(50,11,25,.35); transform: translateY(14px) scale(.98); transition: transform .22s ease; }
    .modal-backdrop.open .modal { transform: translateY(0) scale(1); }
    .modal-kicker { color: var(--hot); font-size:13px; font-weight:800; letter-spacing:.14em; }
    .modal h3 { font-family: Georgia, serif; font-size: 36px; margin: 11px 0 8px; color: #6c2035; }
    .modal p { color: #98747d; margin:0 0 21px; font-size:14px; }
    .close-btn { border:0; background:#fbe1dc; color:#a33a50; padding: 11px 24px; border-radius: 11px; font-weight:800; cursor:pointer; }
    .confetti { position:fixed; z-index:20; top:-20px; width:9px; height:16px; opacity:0; pointer-events:none; animation:fall 2.6s ease-in forwards; }
    @keyframes fall { 0% { opacity:1; transform: translate3d(0,0,0) rotate(0); } 100% { opacity:0; transform: translate3d(var(--drift), 110vh, 0) rotate(720deg); } }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .side { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .shell { width: min(100% - 24px, 520px); padding-top: 18px; } header { margin-bottom: 10px; } .badge { padding: 8px 10px; } .hero { margin: 18px 0 20px; } .hero p { font-size:13px; } .game-card { padding: 17px 13px 20px; border-radius:22px; } .wheel { border-width:8px; } .hub { width:68px; height:68px; border-width:7px; font-size:21px; } .pointer { border-left-width:15px; border-right-width:15px; border-top-width:37px; } .label span { transform: translateY(-14px); } .side { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <header>
        <div class="brand"><div class="brand-mark">♥</div><div><div class="brand-text">LOVE GIFT STUDIO</div><div class="brand-sub">给最爱的她，一点小惊喜</div></div></div>
        <div class="badge">HAPPY VALENTINE'S DAY</div>
      </header>
      <section class="hero">
        <h1>给老婆的<br>情人节礼物转盘</h1>
        <p>今天的好运，交给心动来决定。</p>
      </section>
      <section class="layout">
        <div class="game-card">
          <div class="wheel-wrap">
            <div class="pointer" aria-hidden="true"></div>
            <div class="wheel" id="wheel" aria-label="礼物转盘">
              <div class="labels" id="labels"></div>
            </div>
            <div class="hub" aria-hidden="true">♥</div>
          </div>
          <div class="cta-row"><button class="spin-btn" id="spinBtn">开始抽奖</button></div>
        </div>
        <aside class="side">
          <div class="panel">
            <h2>今日礼物</h2>
            <div class="prize-list" id="prizeList"></div>
            <div class="note">每一次转动，都是我认真准备的爱。</div>
          </div>
          <div class="panel">
            <h2>抽奖记录</h2>
            <div class="history" id="history"><div class="history-empty">还没有抽奖记录<br>转一次，看看今天的惊喜。</div></div>
          </div>
        </aside>
      </section>
      <footer>愿我们每个普通日子，都有值得庆祝的小事。</footer>
    </div>
  </main>
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="modal"><div class="modal-kicker">CONGRATULATIONS</div><h3 id="resultTitle">口红</h3><p id="resultCopy">今天的幸运礼物已经被你抽中啦。</p><button class="close-btn" id="closeBtn">收下礼物</button></div>
  </div>
  <script>
    const prizes = ['化妆品', '口红', '888元红包', '1888红包', '2888红包', '包包', '辣条', '零食', '奶茶'];
    const wheel = document.getElementById('wheel');
    const labels = document.getElementById('labels');
    const list = document.getElementById('prizeList');
    const history = document.getElementById('history');
    const spinBtn = document.getElementById('spinBtn');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const resultTitle = document.getElementById('resultTitle');
    const resultCopy = document.getElementById('resultCopy');
    const closeBtn = document.getElementById('closeBtn');
    let rotation = 0;
    let spinning = false;
    let records = [];
    const colors = ['#f37c91','#f2bf5d','#f37c91','#f2bf5d','#f37c91','#f2bf5d','#f37c91','#f2bf5d','#f37c91'];
    prizes.forEach((prize, i) => {
      const label = document.createElement('div');
      label.className = 'label';
      const angle = i * 40 + 20;
      label.style.transform = `rotate(${angle}deg) translateY(clamp(-180px, -18vw, -100px))`;
      if (angle > 90 && angle < 270) label.classList.add('flip');
      label.innerHTML = `<span>${prize}</span>`;
      labels.appendChild(label);
      const row = document.createElement('div');
      row.className = 'prize';
      row.innerHTML = `<i style="--dot:${colors[i]}"></i><span>${prize}</span>`;
      list.appendChild(row);
    });
    function now() { return new Intl.DateTimeFormat('zh-CN', { hour:'2-digit', minute:'2-digit' }).format(new Date()); }
    function renderHistory() {
      if (!records.length) { history.innerHTML = '<div class="history-empty">还没有抽奖记录<br>转一次，看看今天的惊喜。</div>'; return; }
      history.innerHTML = records.map(r => `<div class="history-item"><span>${r.prize}</span><span class="history-time">${r.time}</span></div>`).join('');
    }
    function confetti() {
      const palette = ['#e74464','#f3bd53','#f98ca1','#8ab8a4','#f4d18a','#fff'];
      for (let i = 0; i < 70; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti';
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = palette[i % palette.length];
        piece.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
        piece.style.setProperty('--drift', `${(Math.random() - .5) * 180}px`);
        piece.style.animationDelay = `${Math.random() * .35}s`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3100);
      }
    }
    spinBtn.addEventListener('click', () => {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      const index = Math.floor(Math.random() * prizes.length);
      const segmentCenter = index * 40 + 20;
      const current = ((rotation % 360) + 360) % 360;
      const desired = (360 - segmentCenter) % 360;
      const delta = 360 * (5 + Math.floor(Math.random() * 3)) + ((desired - current + 360) % 360);
      rotation += delta;
      wheel.style.transform = `rotate(${rotation}deg)`;
      setTimeout(() => {
        const prize = prizes[index];
        records.unshift({ prize, time: now() });
        records = records.slice(0, 5);
        renderHistory();
        resultTitle.textContent = prize;
        resultCopy.textContent = prize.includes('红包') ? '这份心意，祝老婆每天都开开心心。' : '今天的幸运礼物已经被你抽中啦。';
        modalBackdrop.classList.add('open');
        confetti();
        spinning = false;
        spinBtn.disabled = false;
      }, 5900);
    });
    function closeModal() { modalBackdrop.classList.remove('open'); }
    closeBtn.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', e => { if (e.target === modalBackdrop) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
